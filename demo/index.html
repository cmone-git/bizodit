<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3b66">
<meta name="description" content="BizOdit — Business Management">
<link rel="manifest" href="manifest.json">
<title>BizOdit</title>

<style>
:root{
    --brand:#0b3b66;
    --brand-soft:#e8f1f7;
    --bg:#f4f6f8;
    --card:#fff;
    --text:#202b36;
    --muted:#687583;
    --line:#d8dee5;

    --header:76px;
    --sidebar:290px;
    --bottom:78px;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button{
    font:inherit;
}

button:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
}

/* =========================================================
   APP SHELL
========================================================= */

.app-shell{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:var(--header);

    background:#fff;
    border-bottom:1px solid var(--line);

    display:flex;
    align-items:center;
    gap:13px;
    padding:0 20px;
}

.menu-button{
    width:46px;
    height:46px;

    border:1px solid var(--line);
    border-radius:8px;

    background:#fff;
    color:var(--brand);

    display:grid;
    place-items:center;

    cursor:pointer;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    min-width:0;
    text-decoration:none;
}

.logo{
    width:46px;
    height:46px;

    border-radius:8px;
    background:var(--brand);

    display:grid;
    place-items:center;

    overflow:hidden;
    flex:none;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.brand-name{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.brand-name img{
    max-width:160px;
    max-height:29px;

    object-fit:contain;
    object-position:left center;
}

.brand-text{
    color:var(--brand);
    font-size:21px;
    font-weight:750;
}

.brand-sub{
    margin-top:1px;
    color:var(--muted);
    font-size:10px;
}

.header-actions{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:8px;
}

.header-button,
.profile{
    width:46px;
    height:46px;

    border:1px solid var(--line);
    border-radius:8px;

    display:grid;
    place-items:center;

    cursor:pointer;
}

.header-button{
    background:#fff;
    color:var(--brand);
}

.profile{
    border:0;
    background:#edf2f5;
    color:var(--brand);

    font-size:13px;
    font-weight:800;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;
    z-index:1200;

    left:0;
    top:var(--header);
    bottom:0;

    width:var(--sidebar);

    background:#fff;
    border-right:1px solid var(--line);

    padding:18px 13px;

    overflow-y:auto;

    display:flex;
    flex-direction:column;
}

.menu-heading{
    padding:0 12px 12px;

    color:var(--muted);

    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav-item{
    width:100%;
    min-height:50px;

    padding:0 13px;

    border:0;
    border-radius:8px;

    background:transparent;
    color:#687583;

    display:flex;
    align-items:center;
    gap:14px;

    cursor:pointer;
    text-align:left;

    font-size:15px;
    font-weight:650;
}

.nav-item:hover,
.nav-item.active{
    background:var(--brand-soft);
    color:var(--brand);
}

.ico{
    width:24px;
    height:24px;

    flex:none;

    display:grid;
    place-items:center;
}

.ico svg{
    width:100%;
    height:100%;

    fill:none;
    stroke:currentColor;
    stroke-width:1.9;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.sidebar-footer{
    margin-top:auto;

    padding:16px 8px 3px;

    border-top:1px solid var(--line);

    display:flex;
    align-items:center;
    gap:10px;
}

.sidebar-mark{
    width:36px;
    height:36px;

    border-radius:7px;

    background:var(--brand);
    color:#fff;

    display:grid;
    place-items:center;

    font-size:12px;
    font-weight:800;
}

.sidebar-footer strong{
    display:block;
    font-size:12px;
}

.sidebar-footer small{
    display:block;
    margin-top:2px;

    color:var(--muted);
    font-size:9px;
}

/* =========================================================
   MAIN / IFRAME
========================================================= */

.main{
    position:fixed;
    z-index:1;

    top:var(--header);
    left:var(--sidebar);
    right:0;
    bottom:0;

    background:var(--bg);
    overflow:hidden;
}

.module-frame{
    width:100%;
    height:100%;

    border:0;
    display:block;

    background:var(--bg);
}

.frame-loading{
    position:absolute;
    inset:0;

    z-index:3;

    background:var(--bg);

    display:none;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.frame-loading.show{
    display:flex;
}

.frame-loading-inner{
    text-align:center;

    color:var(--muted);

    font-size:12px;
}

.loader-dot{
    width:30px;
    height:30px;

    margin:0 auto 10px;

    border:2px solid var(--line);
    border-top-color:var(--brand);

    border-radius:50%;

    animation:spin .9s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================================================
   MOBILE
========================================================= */

.bottom{
    display:none;
}

.overlay{
    display:none;
}

.mobile-close{
    display:none;
}

@media(max-width:720px){

    :root{
        --header:72px;
        --bottom:76px;
    }

    .header{
        padding:0 11px;
        gap:8px;
    }

    /*
       Mobile:
       No hamburger in header.
       MENU in bottom navigation opens sidebar.
    */

    .menu-button{
        display:none;
    }

    .logo{
        width:43px;
        height:43px;
    }

    .brand-name img{
        max-width:125px;
        max-height:27px;
    }

    .brand-text{
        font-size:20px;
    }

    .header-actions{
        gap:6px;
    }

    .header-button,
    .profile{
        width:42px;
        height:42px;
    }

    .sidebar{
        top:0;

        width:min(330px,86vw);

        transform:translateX(-105%);

        transition:transform .22s ease;

        box-shadow:10px 0 30px rgba(0,0,0,.10);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .overlay{
        position:fixed;
        z-index:1100;

        inset:0;

        background:rgba(20,30,40,.35);
    }

    .overlay.show{
        display:block;
    }

    .mobile-close{
        display:grid;

        margin-left:auto;

        width:44px;
        height:44px;

        border:1px solid var(--line);
        border-radius:8px;

        background:#fff;
        color:var(--brand);

        place-items:center;
    }

    .menu-heading{
        font-size:12px;
        padding:0 13px 13px;
    }

    .nav-item{
        min-height:55px;
        padding:0 14px;

        gap:16px;

        font-size:16px;
    }

    .nav-item .ico{
        width:26px;
        height:26px;
    }

    .main{
        left:0;
        bottom:var(--bottom);
    }

    .bottom{
        position:fixed;
        z-index:1000;

        left:0;
        right:0;
        bottom:0;

        height:var(--bottom);

        background:#fff;
        border-top:1px solid var(--line);

        display:grid;
        grid-template-columns:repeat(5,1fr);

        padding-bottom:env(safe-area-inset-bottom);
    }

    .bottom-item{
        border:0;

        background:#fff;
        color:#707b85;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;

        gap:4px;

        font-size:9px;
        font-weight:750;

        cursor:pointer;
    }

    .bottom-item.active{
        color:var(--brand);
    }

    .bottom-item .ico{
        width:27px;
        height:27px;
    }

    .brand-sub{
        display:none;
    }
}

@media(max-width:390px){

    .brand-name img{
        max-width:110px;
    }

    .header-button,
    .profile{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<div class="app-shell">

<!-- =========================================================

/* =========================================================
   RENDER ICONS
========================================================= */

function renderIcons(){

    document
        .querySelectorAll("[data-icon]")
        .forEach(el=>{

            const name =
                el.getAttribute("data-icon");

            if(ICONS[name]){
                el.innerHTML=ICONS[name];
            }

        });

}


/* =========================================================
   ACTIVE NAVIGATION
========================================================= */

function setActive(route){

    document
        .querySelectorAll(
            ".nav-item,.bottom-item"
        )
        .forEach(item=>{

            item.classList.toggle(
                "active",
                item.dataset.route===route
            );

        });

}


/* =========================================================
   SIDEBAR
========================================================= */

function openMenu(){

    document
        .getElementById("sidebar")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}

function closeMenu(){

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}

function toggleMenu(){

    const sidebar =
        document.getElementById("sidebar");

    if(sidebar.classList.contains("open")){
        closeMenu();
    }else{
        openMenu();
    }

}


/* =========================================================
   OPEN MODULE

   This is the central navigation function.

   index.html stays loaded permanently.
   Only moduleFrame.src changes.

   Dashboard -> dashboard.html
   Home      -> home.html
   CRM       -> index.html
   etc.
========================================================= */

function openPage(route){

    const path =
        MODULES[route];

    if(!path){
        console.error(
            "BizOdit module not found:",
            route
        );
        return;
    }

    const frame =
        document.getElementById("moduleFrame");

    const loading =
        document.getElementById("frameLoading");

    setActive(route);

    loading.classList.add("show");

    frame.title =
        "BizOdit — " + route;

    frame.src =
        path;

    closeMenu();

}


/* =========================================================
   IFRAME LOAD
========================================================= */

document
    .getElementById("moduleFrame")
    .addEventListener(
        "load",
        ()=>{

            document
                .getElementById("frameLoading")
                .classList.remove("show");

        }
    );


/* =========================================================
   SEARCH

   If a module implements:
       window.focusModuleSearch()

   it will receive the search command.
   Otherwise Data opens.
========================================================= */

document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        ()=>{

            const frame =
                document.getElementById(
                    "moduleFrame"
                );

            try{

                if(
                    typeof frame.contentWindow
                        .focusModuleSearch ===
                    "function"
                ){

                    frame.contentWindow
                        .focusModuleSearch();

                    return;

                }

            }catch(e){}

            openPage("data");

        }
    );


/* =========================================================
   NOTIFICATIONS
========================================================= */

document
    .getElementById("bellButton")
    .addEventListener(
        "click",
        ()=>{

            const frame =
                document.getElementById(
                    "moduleFrame"
                );

            try{

                if(
                    typeof frame.contentWindow
                        .openNotifications ===
                    "function"
                ){

                    frame.contentWindow
                        .openNotifications();

                    return;

                }

            }catch(e){}

            openPage("reports");

        }
    );


/* =========================================================
   PROFILE
========================================================= */

document
    .getElementById("profileButton")
    .addEventListener(
        "click",
        ()=>openPage("users")
    );


/* =========================================================
   DESKTOP MENU
========================================================= */

document
    .getElementById("desktopMenuButton")
    .addEventListener(
        "click",
        toggleMenu
    );


/* =========================================================
   MOBILE MENU
========================================================= */

document
    .getElementById("bottomMenu")
    .addEventListener(
        "click",
        toggleMenu
    );

document
    .getElementById("closeMenu")
    .addEventListener(
        "click",
        closeMenu
    );

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        closeMenu
    );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){
            closeMenu();
        }

    }
);


/* =========================================================
   FIREBASE CONFIG

   Your actual Firebase configuration remains in:
       js/firebase-config.js

   The shell loads it without placing API keys here.
========================================================= */

import("./js/firebase-config.js")
    .then(()=>{

        console.log(
            "BizOdit Firebase configuration loaded."
        );

    })
    .catch(error=>{

        console.warn(
            "BizOdit Firebase configuration was not loaded:",
            error
        );

    });


/* =========================================================
   SERVICE WORKER
========================================================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        ()=>{

            navigator.serviceWorker
                .register("./sw.js")
                .catch(error=>{

                    console.warn(
                        "BizOdit service worker:",
                        error
                    );

                });

        }
    );

}


/* =========================================================
   INITIAL LOAD

   VERY IMPORTANT:
   Dashboard opens immediately inside iframe.

   No dashboard HTML is copied into index.html.
========================================================= */

renderIcons();

setActive("dashboard");

document
    .getElementById("moduleFrame")
    .src =
        MODULES.dashboard;

</script>

</body>
</html>
