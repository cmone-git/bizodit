<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../../css/cm.css">
  <link rel="stylesheet" href="../../../css/forms.css">
  <link rel="stylesheet" href="../../../css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>Transactions — CM | BIZODIT</title>
</head>
<body>
  <header class="cm-header">
    <div class="cm-header-inner">
      <div class="cm-header-left">
        <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
        <div class="cm-brand">
          <div class="cm-logo">CM</div>
          <div class="cm-brand-title">CM | BIZODIT</div>
        </div>
      </div>
    </div>
  </header>
  
  <main class="main">
    <div class="page">
      <div class="form-page">
        <section class="module-header">
          <div class="module-header-left">
            <button class="back-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
            <div class="module-title">
              <h1>Transactions</h1>
              <p>Record accounting vouchers</p>
              <div class="report-as-on">Date : <strong id="presentDate">--</strong></div>
            </div>
          </div>
        </section>
        
        <form class="form-section" onsubmit="event.preventDefault();alert('Saved. Connect Firebase data operations for persistence.');">
          <h2>Voucher Entry</h2>
          <div class="form-grid">
            
            <div class="field">
              <label>Voucher No</label>
              <input value="TXN-YY-0001" readonly>
            </div>
            
            <div class="field">
              <label>Date <span class="required">*</span></label>
              <!-- The date is automatically defaulted by the JS at the bottom -->
              <input id="formDate" type="date" required>
            </div>
            
            <div class="field">
              <label>Voucher Type <span class="required">*</span></label>
              <select required>
                <option value="">Select Type</option>
                <option value="Contra">Contra</option>
                <option value="Payment">Payment</option>
                <option value="Receipt">Receipt</option>
                <option value="Journal">Journal</option>
                <option value="Sales">Sales</option>
                <option value="Purchase">Purchase</option>
              </select>
            </div>
            
            <div class="field">
              <label>Ref No</label>
              <input type="text" placeholder="Cheque / UTR / Inv No">
            </div>
            
            <div class="field">
              <label>By Ledger (Dr) <span class="required">*</span></label>
              <select required>
                <option value="">Select Ledger...</option>
                <option value="Cash">Cash Account</option>
                <option value="Bank">Bank Account</option>
                <option value="Expense">Office Expenses</option>
              </select>
            </div>
            
            <div class="field">
              <label>To Ledger (Cr) <span class="required">*</span></label>
              <select required>
                <option value="">Select Ledger...</option>
                <option value="Sales">Sales Account</option>
                <option value="Client">Client / Debtor</option>
                <option value="Cash">Cash Account</option>
              </select>
            </div>
            
            <div class="field">
              <label>Amount (₹) <span class="required">*</span></label>
              <input type="number" step="0.01" min="0" required placeholder="0.00">
            </div>
            
            <div class="field full">
              <label>Narration</label>
              <textarea rows="3" placeholder="Enter transaction details..."></textarea>
            </div>
            
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="history.back()">Cancel</button>
            <button class="btn btn-primary"><i data-lucide="save"></i>Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a class="bottom-item" href="../../../index.html"><i data-lucide="house"></i><span>HOME</span></a>
      <a class="bottom-item" href="../../crm/crm.html"><i data-lucide="users-round"></i><span>CRM</span></a>
      <a class="bottom-item" href="../../accounts/accounts.html"><i data-lucide="wallet"></i><span>ACCOUNTS</span></a>
      <a class="bottom-item" href="../../settings/settings.html"><i data-lucide="settings-2"></i><span>SETTINGS</span></a>
    </div>
  </nav>
  
  <script type="module">
    import { formatIndianDate, todayISO } from "../../../js/date.js";
    document.getElementById("presentDate").textContent = formatIndianDate(new Date());
    document.getElementById("formDate").value = todayISO();
    window.lucide.createIcons();
  </script>
</body>
</html>
